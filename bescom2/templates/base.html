<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BESCOM Power Alert{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<aside class="sidebar">
    <div class="brand">
        <div class="bolt">⚡</div>
        <div class="name">BESCOM<span>OUTAGE ALERTS</span></div>
    </div>
    <nav>
        <a href="{{ url_for('index') }}" class="{% if active_page=='home' %}active{% endif %}">
            <span>🏠</span> Dashboard
        </a>
        <a href="{{ url_for('report_outage') }}" class="{% if active_page=='report' %}active{% endif %}">
            <span>⚠️</span> Report Outage
        </a>
        <a href="{{ url_for('manage_areas') }}" class="{% if active_page=='areas' %}active{% endif %}">
            <span>📍</span> Areas
        </a>
        <a href="{{ url_for('register_user') }}" class="{% if active_page=='users' %}active{% endif %}">
            <span>👥</span> Users
        </a>
    </nav>
    <div class="sidebar-footer">
        <a href="{{ url_for('public_register') }}" class="footer-link" target="_blank">🔗 Public Register Page</a>
        <a href="{{ url_for('logout') }}" class="logout-btn">⎋ Logout</a>
    </div>
</aside>
<main class="main">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}{% for cat, msg in messages %}
            <div class="flash {{ cat }}">{{ msg }}</div>
        {% endfor %}{% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
